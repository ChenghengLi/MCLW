# =============================================
# MCL Watermark Configuration
# =============================================
# This config file controls the Markov Chain-Lock (MCL) watermarking system.

# =============================================
# MODEL SETTINGS
# =============================================
model:
  # Language model for text generation
  generator:
    name: "meta-llama/Llama-3.2-3B-Instruct"
    device: "cuda"              # "cuda" for GPU, "cpu" for CPU
    max_length: 256             # Maximum tokens to generate per sample
    temperature: 1.0            # 1.0 = greedy within state constraints

# =============================================
# MCL WATERMARK SETTINGS
# =============================================
mcl:
  # Secret key for watermark - CHANGE THIS for your deployment
  # The key determines how tokens are assigned to states via SHA-256 hash
  secret_key: "your-secret-key-change-me-2024"
  
  # Number of Markov chain states (2-7 recommended)
  # More states = stronger detection but fewer tokens available per state
  # - 2 states: 50% vocab per state, random baseline 50%
  # - 4 states: 25% vocab per state, random baseline 25%
  # - 6 states: 16.7% vocab per state, random baseline 16.7%
  num_states: 4
  
  # Transition topology: how states connect
  # - "clockwork": strict cycle 0->1->2->3->0 (strongest detection)
  # - "binary": alternating 0->1->0->1
  # - "soft_cycle": allows skipping one state (better quality)
  chain_key: "clockwork"
  
  # Overlap ratio for soft partitions (0.0 - 1.0)
  # Higher overlap = more tokens available = better quality but weaker detection
  # - 0.00: hard partition, each token in exactly 1 state
  # - 0.10: ~33% of vocab per state
  # - 0.15: ~36% of vocab per state
  overlap_ratio: 0.10
  
  # Detection threshold (0.0 - 1.0)
  # Score above this = classified as watermarked
  # For clockwork with S states, random baseline is 1/S (0.25 for S=4)
  # Recommended: 0.5 for strong detection
  detection_threshold: 0.5

# =============================================
# DATASET GENERATION
# =============================================
generation:
  # Sample prompts for generating watermarked text
  prompts:
    - "Explain the concept of machine learning in simple terms."
    - "Describe the effects of climate change on ocean ecosystems."
    - "Write about the future of renewable energy technology."
    - "Discuss the ethical implications of artificial intelligence."
    - "Explain how quantum computers differ from classical computers."
  
  # Number of samples to generate per prompt
  n_samples_per_prompt: 5
  
  # Random seed for reproducibility
  random_seed: 42

# =============================================
# DATA PATHS
# =============================================
data:
  output_dir: "data/"           # Where to save generated datasets
  human_dir: "data/human"       # Human-written text for comparison
  output_format: "jsonl"        # Output format: "jsonl" or "txt"

# =============================================
# OUTPUT SETTINGS
# =============================================
output:
  results_dir: "results/"
  save_intermediates: true
